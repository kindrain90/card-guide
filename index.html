<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>롯데시네마 할인 카드 가이드 | 스마트한 영화 관람</title>
    <meta name="description" content="롯데시네마에서 할인받을 수 있는 신용카드, 통신사, 멤버십 혜택을 한눈에 비교해보세요.">
    <meta name="theme-color" content="#FDFBF7">
    <meta property="og:title" content="롯데시네마 할인 카드 가이드">
    <meta property="og:description" content="롯데시네마에서 할인받을 수 있는 신용카드, 통신사, 멤버십 혜택을 한눈에 비교해보세요.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-glow"></div>

    <div class="container">
        <header>
            <h1 class="logo clickable" id="homeLogo">LOTTE &nbsp;<span>CINEMA</span></h1>
            <p class="subtitle">롯데시네마 최신 할인 가이드 <span class="version-badge">2026.02 Ver</span></p>
            <p class="notice">※ 자세한 내용은 해당 카드사 홈페이지를 확인해주시기 바랍니다.</p>
        </header>

        <!-- 카드사 필터 탭 -->
        
    <div class="filter-wrapper">
        <div class="filter-group">
            <div class="group-label">FILTER</div>
            <div class="filter-container" id="issuerButtons">
                <button type="button" class="filter-btn active" data-issuer="all">전체</button>
                <button type="button" class="filter-btn" data-issuer="lotte">롯데</button>
                <button type="button" class="filter-btn" data-issuer="kb">KB국민</button>
                <button type="button" class="filter-btn" data-issuer="samsung">삼성</button>
                <button type="button" class="filter-btn" data-issuer="shinhan">신한</button>
                <button type="button" class="filter-btn" data-issuer="hyundai">현대</button>
                <button type="button" class="filter-btn" data-issuer="woori">우리</button>
                <button type="button" class="filter-btn" data-issuer="hana">하나</button>
                <button type="button" class="filter-btn" data-issuer="ib">IBK기업</button>
                <button type="button" class="filter-btn" data-issuer="nh">NH농협</button>
            </div>
        </div>
    </div>


        <section id="cardGrid" class="card-grid">
            <!-- 자바스크립트에 의해 동적으로 생성됩니다 -->
        </section>
    </div>

    
    <!-- 이미지 모달 -->
    <div id="imageModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <button type="button" class="close-modal" aria-label="닫기">&times;</button>
            <img id="modalImg" class="modal-img" src="" alt="카드 이미지">
            <h2 id="modalTitle" class="modal-title"></h2>

            <section class="modal-limits" id="modalLimitsSection">
                <h3>상세 내용</h3>
                <ul id="modalLimitsList" class="modal-limits-list"></ul>
                <a id="modalSourceLink" class="modal-source-link" href="#" target="_blank" rel="noopener noreferrer">출처 보기</a>
            </section>
        </div>
    </div>


<script defer src="limits_data.js"></script> <!-- 추가 -->
    <script defer src="cinema_details.js"></script>
    <script defer src="script.js"></script>
</body>

</html>
